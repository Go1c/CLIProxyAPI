name: Deploy CLIProxyAPI Production

on:
  push:
    branches:
      - publish
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after building the image
        required: false
        type: boolean
        default: false
      deploy_target:
        description: Which CPA CLIProxy instance to deploy (a=default pool, b=second pool, both)
        required: false
        type: choice
        options:
          - a
          - b
          - both
        default: both

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/go1c/cliproxyapi

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cliproxyapi-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Non-blocking: upstream CLIProxyAPI ships a few pre-existing failing unit
      # tests and runs no tests in its own CI. Keep the step for visibility but do
      # not block the production build/deploy on upstream's stale tests.
      - name: Test Go
        run: go test ./...
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:production
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Prepare SSH
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') }}
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$PROD_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') }}
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          # Push to publish deploys CPA-A and CPA-B together. Manual runs can still pick a/b/both.
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'both' }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          SHA="${{ github.sha }}"
          TARGET="${DEPLOY_TARGET:-both}"
          remote_cmd=""
          case "${TARGET}" in
            a)
              remote_cmd="/opt/lumio/bin/deploy-service.sh cliproxyapi '${IMAGE}' '${SHA}'"
              ;;
            b)
              remote_cmd="/opt/lumio/bin/deploy-service.sh cliproxyapi-b '${IMAGE}' '${SHA}'"
              ;;
            both)
              remote_cmd="/opt/lumio/bin/deploy-service.sh cliproxyapi '${IMAGE}' '${SHA}' && /opt/lumio/bin/deploy-service.sh cliproxyapi-b '${IMAGE}' '${SHA}'"
              ;;
            *)
              echo "Unknown deploy_target: ${TARGET}" >&2
              exit 2
              ;;
          esac
          echo "Deploy target=${TARGET}"
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${PROD_USER:-deploy}@${PROD_HOST}" \
            "${remote_cmd}"
